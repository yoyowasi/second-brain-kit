name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: install.sh smoke test
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh
          fake_home="$(mktemp -d)"
          HOME="$fake_home" bash install.sh --all
          test -f "$fake_home/.claude/hooks/brain_common.py"
          grep -q brain-journal.py "$fake_home/.claude/settings.json"
